# SONDE TEMPORAIRE (change screen-workflow-followups, tâche 1) : un nom d'archive fixe
# survit-il au rejeu du job ? À retirer avant la fusion.
name: extra-probe-artifact
on: pull_request
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/probe.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-fixed-name
          path: ${{ runner.temp }}/probe.txt
