apiVersion: knock.io/v1alpha1
kind: MirrorPolicy
metadata:
  name: example-repair
  labels:
    admission-track: standard
spec:
  artifactType: image
  source: {registry: docker.io, repository: library/alpine}
  imports:
    # 3.22.0 a été réparée et promue avant uske 0.10 ; 3.22.1, nouvelle pour cette politique,
    # éprouve la réparation sous le contrat de la 0.10 (tier `id`, règle `curable`).
    - name: v3-22-0-1
      tags: {includeRegex: "^3\\.22\\.[01]$"}
      remediate:
        - rewritePackageSources: {mirror: public}
        - upgradePackages: {}
      destinations: [{registry: ghcr, project: trivoallan, repository: uske-example/alpine-repaired}]
