# Sonde temporaire (change reports-survive-rerun) : une empreinte jamais jugée, pour éprouver le
# rejeu d'un job. Retirée avant la fusion.
apiVersion: knock.io/v1alpha1
kind: MirrorPolicy
metadata:
  name: example-rerun-probe
  labels:
    admission-track: standard
spec:
  artifactType: image
  source: {registry: docker.io, repository: library/busybox}
  imports:
    - name: probe
      tags: {includeRegex: "^1\\.37\\.0$"}
      destinations: [{registry: ghcr, project: trivoallan, repository: uske-example/busybox-rerun-probe}]
