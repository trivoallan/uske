# The artifact repository the screening's children pass their work through (change
# `screen-and-policy-fan-out`, D9 and D10), as in Argo's quick-start: a throwaway MinIO, its
# bucket created at start. Its credentials are the Secret `uske-minio`, created by up.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-repositories
  annotations:
    workflows.argoproj.io/default-artifact-repository: default-v1
data:
  default-v1: |
    s3:
      bucket: uske
      endpoint: minio:9000
      insecure: true
      accessKeySecret: {name: uske-minio, key: accesskey}
      secretKeySecret: {name: uske-minio, key: secretkey}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          # The image Argo v4.1.4's quick-start pins.
          image: quay.io/minio/minio:RELEASE.2022-11-17T23-20-09Z@sha256:b2a98df34c3e8d605a5e96f0bc1657dd440a5bd53d95465a7b342e736da9c6cf
          command: [minio, server, /data]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: uske-minio, key: accesskey}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: uske-minio, key: secretkey}}
          ports:
            - containerPort: 9000
          lifecycle:
            postStart:
              exec:
                command: [mkdir, -p, /data/uske]
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: {app: minio}
  ports:
    - port: 9000
