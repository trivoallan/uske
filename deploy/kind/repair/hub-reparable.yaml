# Demonstration policy for the kind environment (change issue-transformation).
# A source the full playbook sends to repair ("Transformation requise", measured with regis on
# 2026-10-10): knock rebuilds it in the transit, regis judges what it built.
# What the bench expects of it: repaired, promoted and signed: its findings sit in apk packages, which upgradePackages upgrades.
apiVersion: knock.io/v1alpha1
kind: MirrorPolicy
metadata:
  name: hub-reparable
  labels:
    admission-track: standard
    cao: cao-plateforme
spec:
  artifactType: image
  source:
    registry: registry.uske.svc.cluster.local:5000  # a host; destinations name the roster
    repository: mirror/alpine
  imports:
    - name: demo
      owners:
        - group:default/cao-plateforme
      tags:
        includeRegex: "^3\\.18\\.0$"
        semverOnly: false
      transform:
        - rewritePackageSources: { mirror: bench }
        - upgradePackages: { epoch: "2026-10-10" }
      destinations:
        - registry: local
          project: hub
          repository: alpine
