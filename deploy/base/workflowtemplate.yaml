# One screening is a parent, `uske-screening`, and one child Workflow per policy, `uske-policy`
# (change `screen-and-policy-fan-out`, D7 to D12). The parent fixes the commit, the epoch and the
# `run` written on every line, snapshots the journals, creates the children and waits for them,
# then merges their lines into the journals in one pod.
#
# In a child, knock plans, regis judges the plan's digests, and knock applies only the approved
# operations (D-30, knock's gate). A source refused on rules its track lists as repairable is
# handed back with a remediation order: knock repairs that digest, holds it in a transit registry,
# where it is judged by its own digest and promoted only if it is sound (change
# `split-knock-policy-transform-remediate`). A transform-only rebuild is placed directly.
#
# The children share no volume: a child's work travels from step to step as the artifact `work`,
# in the namespace's artifact repository, and it judges on a copy of its policy's journal. Only
# the parent's snapshot and merge mount `uske-results`: the merge appends the lines, the snapshot
# only leaves its mark, `.pending-merge/<run>`, which the merge clears. So the storage stays
# ReadWriteOnce. Two ceilings, set by the overlay: the parent's `parallelism` (policies at a time)
# and the child's (steps at a time, so judgements).
#
# Keys in the artifact repository, under `runs/<run>/`: a policy's name always comes after a fixed
# directory, so no name collides with another key: `snapshot.tgz`, `listed.json` and
# `expected.json` (the parent's), `out/<policy>/<created>-<child>.tgz` (each child's new lines,
# read whole by the merge), `done/<policy>` (each succeeded child, read whole by the summary), and
# `policies/<policy>/<child>/…` (what a child passes between its own steps).
#
# No token ever reaches a disk: git gets it as a header for one command, never in a remote URL.
# Change `socle-amorce-orchestrateur`, design decisions 3 and 6 to 10.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: uske-screening
spec:
  serviceAccountName: uske
  entrypoint: screening
  parallelism: 1  # ceiling: policies at a time
  artifactRepositoryRef: {configMap: artifact-repositories, key: default-v1}
  # The snapshot, the list and the expected names go with the parent. The children's lines and
  # done marks are kept (`strategy: Never`): a bucket lifecycle rule on `runs/` removes them.
  artifactGC:
    strategy: OnWorkflowDeletion
    serviceAccountName: uske
  arguments:
    parameters:
      - name: repository  # host/path of this repository, set by the overlay
      - name: policies
        value: policies/pilote
      - name: playbooks  # in that repository too
        value: playbooks
      - name: transit  # a name of KNOCK_REGISTRIES: where remediated images are held until judged
        value: transit
      # The remediation orders' epoch: the screening's start, UTC. Written into the repair's RUN,
      # so a later screening never reuses an earlier upgrade layer.
      - name: epoch
        value: "{{workflow.creationTimestamp.Y}}{{workflow.creationTimestamp.m}}{{workflow.creationTimestamp.d}}T{{workflow.creationTimestamp.H}}{{workflow.creationTimestamp.M}}{{workflow.creationTimestamp.S}}Z"
  # The parent's checkout and list only, one after the other; no child mounts it.
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

  templates:
    - name: screening
      failFast: false  # one failed child never keeps the next ones from being created
      steps:
        - - name: checkout
            template: checkout
        - - name: list
            template: list
        - - name: snapshot  # fails while another screening's merge is pending
            template: snapshot
            arguments:
              artifacts:
                - {name: listed, from: "{{steps.list.outputs.artifacts.listed}}"}
        # withParam needs the list as a parameter; the parent's node status at 10,000 policies
        # is for the spike to measure. No other step gets a list as a parameter: past ~1,300
        # policies, it would outgrow what an environment variable holds.
        - - name: policy
            template: policy
            withParam: "{{steps.snapshot.outputs.result}}"
            continueOn:  # the other policies go on; summary names this one
              failed: true
              error: true
            arguments:
              parameters:
                - {name: name, value: "{{item.name}}"}
                - {name: path, value: "{{item.path}}"}
                - {name: snapshot-lines, value: "{{item.lines}}"}
                - {name: commit, value: "{{steps.checkout.outputs.parameters.commit}}"}
        - - name: merge  # after every child, failed ones included: what they placed is recorded
            template: merge
            continueOn:
              failed: true
              error: true
        - - name: summary
            template: summary
            when: "{{steps.policy.status}} != Skipped"
            arguments:
              parameters:
                - {name: merge, value: "{{steps.merge.status}}"}
              artifacts:
                - {name: expected, from: "{{steps.snapshot.outputs.artifacts.expected}}"}
          - name: merge-failed  # no policy, so no summary: the merge must still be seen
            template: fail
            when: "{{steps.policy.status}} == Skipped && {{steps.merge.status}} != Succeeded"
            arguments:
              parameters:
                - {name: message, value: the merge into the journals failed}

    - name: checkout
      # Container steps only: a retry on a steps template would replay the whole screening.
      retryStrategy: &retry
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: 10s
          factor: "2"
      container:
        image: git
        command: [sh, -c]
        # The commit, not the branch: every child judges with this screening's policies (D7).
        # The token goes as a header to this one command: never in the remote URL, so never in
        # /work/repo/.git/config.
        args:
          - >-
            rm -rf /work/repo &&
            git -c http.extraHeader="Authorization: Basic $(printf 'oauth2:%s' "$TOKEN" | base64 | tr -d '\n')"
            clone -q --depth 1 "https://{{workflow.parameters.repository}}" /work/repo &&
            git -C /work/repo rev-parse HEAD > /tmp/commit
        env:
          - name: TOKEN
            valueFrom:
              secretKeyRef: {name: uske-repository, key: token}
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: commit
            valueFrom: {path: /tmp/commit}

    - name: list  # to a file: the list grows with the policies, past what a parameter holds
      retryStrategy: *retry
      container:
        image: uske
        command: [sh, -c]
        args: ["python -m uske list --policies /work/repo/{{workflow.parameters.policies}} > /tmp/listed.json"]
        workingDir: /app
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        artifacts:
          - name: listed
            path: /tmp/listed.json
            archive: {none: {}}
            s3: {key: "runs/{{workflow.name}}/listed.json"}

    # The journals as they stand, for the children to judge on (D9), each policy's line count,
    # which `uske export` skips, and the names the summary expects. It leaves the mark
    # `.pending-merge/<run>` beside the journals and fails on another run's: the next screening
    # never judges on a journal whose merge failed (D12). Under the merge's lock: never a
    # half-merged journal.
    - name: snapshot
      retryStrategy: *retry
      synchronization:
        mutexes:
          - name: uske-journal
      inputs:
        artifacts:
          - {name: listed, path: /tmp/listed.json, mode: 292}  # 0444: uske runs as non-root
      volumes:
        - name: results
          persistentVolumeClaim: {claimName: uske-results}
      container:
        image: uske
        command: [python, -m, uske]
        args:
          - snapshot
          - --listed=/tmp/listed.json
          - --results=/results
          - --out=/tmp/snapshot
          - --expected=/tmp/expected.json
          - --run={{workflow.name}}
        workingDir: /app
        volumeMounts:
          - {name: results, mountPath: /results}  # written: the mark only
      outputs:
        artifacts:
          - name: snapshot
            path: /tmp/snapshot
            s3: {key: "runs/{{workflow.name}}/snapshot.tgz"}
          - name: expected
            path: /tmp/expected.json
            archive: {none: {}}
            s3: {key: "runs/{{workflow.name}}/expected.json"}

    # One child per policy, owned by this screening: deleting it deletes them (D7). The resource
    # step fails with its child.
    - name: policy
      inputs:
        parameters: [{name: name}, {name: path}, {name: snapshot-lines}, {name: commit}]
      resource:
        action: create
        setOwnerReference: true
        successCondition: status.phase == Succeeded
        failureCondition: status.phase in (Failed,Error)
        manifest: |
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
            generateName: "{{inputs.parameters.name}}-"
            labels:
              uske.io/policy: "{{inputs.parameters.name}}"
              uske.io/screening: "{{workflow.name}}"
          spec:
            workflowTemplateRef:
              name: uske-policy
            arguments:
              parameters:
                - {name: repository, value: "{{workflow.parameters.repository}}"}
                - {name: commit, value: "{{inputs.parameters.commit}}"}
                - {name: name, value: "{{inputs.parameters.name}}"}
                - {name: path, value: "{{inputs.parameters.path}}"}
                - {name: playbooks, value: "{{workflow.parameters.playbooks}}"}
                - {name: transit, value: "{{workflow.parameters.transit}}"}
                - {name: epoch, value: "{{workflow.parameters.epoch}}"}
                - {name: run, value: "{{workflow.name}}"}
                - {name: snapshot-lines, value: "{{inputs.parameters.snapshot-lines}}"}
                - {name: merge, value: "false"}

    # The only writer of the journals: every child's `lines` archives, a policy's in the order its
    # children were created, appended by the rule of `uske record`; then the snapshot's mark goes.
    # Replayed by `argo retry`, it appends nothing (D12). A line written to the journal since the
    # snapshot, by hand, wins: the child's lines on its digest are refused, and the merge fails
    # and keeps the mark (D12).
    - name: merge
      retryStrategy: *retry
      synchronization:
        mutexes:
          - name: uske-journal
      inputs:
        artifacts:
          - name: lines  # <policy>/<created>-<child>.tgz per child that wrote; none at all is fine
            path: /tmp/out
            mode: 511  # 0777: uske runs as non-root
            recurseMode: true
            optional: true
            archive: {none: {}}
            s3: {key: "runs/{{workflow.name}}/out/"}
      volumes:
        - name: results
          persistentVolumeClaim: {claimName: uske-results}
      container:
        image: uske
        command: [sh, -c]
        args: ["python -m uske merge --results /results --from /tmp/out --pending {{workflow.name}}"]
        workingDir: /app
        volumeMounts:
          - {name: results, mountPath: /results}

    # Fails naming the failed policies, or a failed merge. A policy is done when its child left
    # `runs/<run>/done/<policy>`: a child that failed, erred or was never created left nothing.
    - name: summary
      inputs:
        parameters: [{name: merge}]
        artifacts:
          - {name: expected, path: /tmp/expected.json, mode: 292}  # the snapshot's list of names
          - name: done
            path: /tmp/done
            mode: 511  # 0777: uske runs as non-root
            recurseMode: true
            optional: true
            archive: {none: {}}
            s3: {key: "runs/{{workflow.name}}/done/"}
      script:
        image: uske
        command: [python]
        env:
          - {name: MERGE, value: "{{inputs.parameters.merge}}"}
        source: |
          import json, os, sys
          from pathlib import Path

          marks = Path("/tmp/done")
          done = {p.name for p in marks.iterdir() if p.is_file()} if marks.is_dir() else set()
          expected = json.loads(Path("/tmp/expected.json").read_text("utf-8"))
          failed = [name for name in expected if name not in done]
          merge = os.environ["MERGE"]
          print(json.dumps({"policies": len(expected), "failed": failed, "merge": merge}))
          if failed:
              print(f"failed policies: {', '.join(failed)}", file=sys.stderr)
          if merge != "Succeeded":
              print(f"merge: {merge}", file=sys.stderr)
          sys.exit(1 if failed or merge != "Succeeded" else 0)

    - name: fail  # no retry
      inputs:
        parameters:
          - name: message
      container:
        image: uske
        command: [sh, -c]
        args: ["echo '{{inputs.parameters.message}}' >&2; exit 1"]
---
# One policy, judged and placed. Created by `uske-screening` with `merge: "false"`; resubmitted
# alone with `merge: "true"`, it merges its own lines at the end.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: uske-policy
spec:
  serviceAccountName: uske
  entrypoint: main
  parallelism: 1  # ceiling: steps at a time in a child, so judgements at a time
  artifactRepositoryRef: {configMap: artifact-repositories, key: default-v1}
  # A child's work goes with it, a day after it ends (ttlStrategy). What the parent still reads,
  # its `lines` archives and its done mark, is kept (`strategy: Never` on those outputs).
  artifactGC:
    strategy: OnWorkflowDeletion
    serviceAccountName: uske
  # One writer per policy, across every screening of the namespace.
  synchronization:
    mutexes:
      - name: "policy-{{workflow.parameters.name}}"
  ttlStrategy:
    secondsAfterCompletion: 86400  # 10 000 Workflows a screening: keep the controller light
  podGC:
    strategy: OnPodSuccess
  arguments:
    parameters:
      - name: repository
      - name: commit  # the parent's checkout: every child judges with the same policies
      - name: name
      - name: path  # the policy file, under /work/repo
      - name: playbooks
        value: playbooks
      - name: transit
        value: transit
      - name: epoch
      - name: run  # the parent's name: every line of a screening carries it (SDR-0018)
      - name: snapshot-lines  # the journal's line count in the parent's snapshot
        value: "0"
      - name: merge
        value: "true"

  templates:
    - name: main
      steps:
        - - name: policy
            template: policy
            continueOn:  # what was decided and placed is merged all the same
              failed: true
              error: true
        - - name: merge
            template: merge
            when: "{{workflow.parameters.merge}} == true"
        - - name: failed
            template: fail
            when: "{{steps.policy.status}} != Succeeded"
            arguments:
              parameters:
                - {name: message, value: "the policy {{workflow.parameters.name}} failed"}
          - name: done  # what the parent's summary counts: no mark, a failed policy
            template: done
            when: "{{steps.policy.status}} == Succeeded"

    # Every step takes the artifact `work` from the last step that changed it and hands its own on;
    # `pending` and `resolve` only read it, and hand nothing on. The steps
    # that write lines also return `lines`, uploaded before the next step starts: a decision is
    # durable before the placement it allows, and a failed upload fails the step (D9).
    - name: policy
      steps:
        - - name: checkout
            template: checkout
        - - name: prepare
            template: uske
            arguments:
              parameters:
                - name: args
                  value: >-
                    prepare --policy {{workflow.parameters.path}}
                    --out /work/policies/{{workflow.parameters.name}}/policy.yaml
              artifacts:
                - {name: work, from: "{{steps.checkout.outputs.artifacts.work}}"}
        - - name: plan  # knock's gate, step 1: place nothing, write every operation (D-30)
            template: knock
            arguments:
              parameters:
                - name: args
                  value: >-
                    reconcile /work/policies/{{workflow.parameters.name}}
                    --plan-out /work/plans/{{workflow.parameters.name}}.json
              artifacts:
                - {name: work, from: "{{steps.prepare.outputs.artifacts.work}}"}
        - - name: pending
            template: uske-read
            arguments:
              parameters:
                - name: args
                  value: >-
                    pending --policy {{workflow.parameters.path}}
                    --plan /work/plans/{{workflow.parameters.name}}.json --results /work/results
              artifacts:
                - {name: work, from: "{{steps.plan.outputs.artifacts.work}}"}
          - name: resolve
            template: uske-read
            arguments:
              parameters:
                - name: args
                  value: resolve --policy {{workflow.parameters.path}} --playbooks /work/repo/{{workflow.parameters.playbooks}}
              artifacts:
                - {name: work, from: "{{steps.plan.outputs.artifacts.work}}"}
        - - name: evaluate
            template: evaluate
            withParam: "{{steps.pending.outputs.result}}"
            when: "{{=jsonpath(steps.resolve.outputs.result, '$.playbook') != nil}}"
            arguments:
              parameters:
                - {name: playbook, value: "{{=jsonpath(steps.resolve.outputs.result, '$.playbook')}}"}
                - {name: ref, value: "{{item.ref}}"}
                - {name: digest, value: "{{item.digest}}"}
                - {name: target, value: "{{item.target}}"}
                - {name: key, value: "{{item.key}}"}
                - {name: track, value: "{{=jsonpath(steps.resolve.outputs.result, '$.track') ?? ''}}"}
              artifacts:
                - {name: work, from: "{{steps.plan.outputs.artifacts.work}}"}
          - name: unevaluated  # unknown track: never sent to regis (D-21)
            template: classify
            withParam: "{{steps.pending.outputs.result}}"
            when: "{{=jsonpath(steps.resolve.outputs.result, '$.playbook') == nil}}"
            arguments:
              parameters:
                - name: args
                  value: classify --ref {{item.ref}} --digest {{item.digest}} --run "{{workflow.parameters.run}}"
                - {name: key, value: "{{item.key}}"}
                - {name: digest, value: "{{item.digest}}"}
              artifacts:
                - {name: work, from: "{{steps.plan.outputs.artifacts.work}}"}
        - - name: record
            template: record-judged
            arguments:
              parameters:
                - name: args
                  value: >-
                    record --policy {{workflow.parameters.path}} --results /work/results
                    --lines /tmp/judged/lines
              artifacts:
                - {name: work, from: "{{steps.plan.outputs.artifacts.work}}"}
        - - name: approve
            template: uske
            arguments:
              parameters:
                - name: args
                  value: >-
                    approve --policy {{workflow.parameters.path}} --results /work/results
                    --plan /work/plans/{{workflow.parameters.name}}.json
                    --out /work/plans/{{workflow.parameters.name}}.approved.json
                    --transit "{{workflow.parameters.transit}}"
                    --epoch {{workflow.parameters.epoch}}
                    --lines-out /work/approve-lines/{{workflow.parameters.name}}.json
                    --run "{{workflow.parameters.run}}"
              artifacts:
                - {name: work, from: "{{steps.record.outputs.artifacts.work}}"}
        - - name: record-approve  # a source to repair without a transit: judged again next time
            template: record
            arguments:
              parameters:
                - name: args
                  value: >-
                    record --policy {{workflow.parameters.path}} --results /work/results
                    --lines /work/approve-lines/{{workflow.parameters.name}}.json
              artifacts:
                - {name: work, from: "{{steps.approve.outputs.artifacts.work}}"}
        - - name: place  # knock's gate, step 2, no order: copies and transform-only rebuilds placed
            template: knock-once
            when: >-
              {{=jsonpath(steps.approve.outputs.result, '$.approved') > 0 &&
              jsonpath(steps.approve.outputs.result, '$.ordered') == 0}}
            continueOn:  # what was placed must still be recorded
              failed: true
              error: true
            arguments:
              parameters:
                - name: args
                  value: >-
                    reconcile /work/policies/{{workflow.parameters.name}}
                    --apply-plan /work/plans/{{workflow.parameters.name}}.approved.json
                    --applied-out /work/applied/{{workflow.parameters.name}}.json
              artifacts:
                - {name: work, from: "{{steps.record-approve.outputs.artifacts.work}}"}
          - name: place-staged  # with orders: the remediated images are held in the transit
            template: knock-once
            when: "{{=jsonpath(steps.approve.outputs.result, '$.ordered') > 0}}"
            continueOn:  # one failed build must not withhold the images that were held
              failed: true
              error: true
            arguments:
              parameters:
                - name: args
                  value: >-
                    reconcile /work/policies/{{workflow.parameters.name}}
                    --apply-plan /work/plans/{{workflow.parameters.name}}.approved.json
                    --stage-to {{workflow.parameters.transit}}
                    --staged-out /work/staged/{{workflow.parameters.name}}.json
                    --applied-out /work/applied/{{workflow.parameters.name}}.json
              artifacts:
                - {name: work, from: "{{steps.record-approve.outputs.artifacts.work}}"}
        - - name: record-applied  # the source → placed link, and the orders knock withheld
            template: record
            when: "{{=jsonpath(steps.approve.outputs.result, '$.approved') > 0}}"
            arguments:
              parameters:
                - name: args
                  value: >-
                    record --policy {{workflow.parameters.path}} --results /work/results
                    --applied /work/applied/{{workflow.parameters.name}}.json
                    --run "{{workflow.parameters.run}}"
              artifacts:
                - name: work  # whichever apply ran left it there; a failed one too
                  s3: {key: "runs/{{workflow.parameters.run}}/policies/{{workflow.parameters.name}}/{{workflow.name}}/placed.tgz"}
        - - name: second-gate  # ordered > 0 implies approved > 0: record-applied ran
            template: staged
            when: "{{=jsonpath(steps.approve.outputs.result, '$.ordered') > 0}}"
            arguments:
              parameters:
                - {name: playbook, value: "{{=jsonpath(steps.resolve.outputs.result, '$.playbook')}}"}
              artifacts:
                - {name: work, from: "{{steps.record-applied.outputs.artifacts.work}}"}
        - - name: place-failed  # the failure stays visible once everything held has been handled
            template: fail
            when: >-
              {{steps.place.status}} == Failed || {{steps.place.status}} == Error ||
              {{steps.place-staged.status}} == Failed || {{steps.place-staged.status}} == Error
            arguments:
              parameters:
                - {name: message, value: knock reconcile --apply-plan failed for this policy}

    # One digest: regis judges, classify writes the line. Both land at fixed keys of this child,
    # where `record-judged` reads them back as a directory: the fan-out shares no volume (D9).
    - name: evaluate
      inputs:
        parameters:
          - {name: playbook}
          - {name: ref}
          - {name: digest}
          - {name: target}
          - {name: key}
          # A held image names its source and writes its lines apart: read with the first
          # gate's, the source's own line would be replayed after its closure.
          - {name: source-ref, value: ""}
          - {name: source-digest, value: ""}
          - {name: lines, value: lines}
          - {name: track, value: ""}  # first gate: the track whose repairable rules apply
          - {name: epoch, value: ""}  # held image: the remediation order it was built under
        artifacts:
          - name: work
      steps:
        - - name: regis
            template: regis-analyze
            continueOn:
              failed: true  # a failed evaluation is recorded inconclusive, not lost (D-23)
            arguments:
              parameters:
                - {name: target, value: "{{inputs.parameters.target}}"}
                - {name: playbook, value: "{{inputs.parameters.playbook}}"}
              artifacts:
                - {name: work, from: "{{inputs.artifacts.work}}"}
        - - name: classify
            template: classify
            arguments:
              parameters:
                - name: args
                  value: >-
                    classify --playbook {{inputs.parameters.playbook}}
                    --ref {{inputs.parameters.ref}} --digest {{inputs.parameters.digest}}
                    --report /tmp/report/report.json
                    --report-link /results/reports/{{workflow.parameters.name}}/{{inputs.parameters.digest}}/{{workflow.parameters.run}}.html
                    --regis-exit {{steps.regis.exitCode}}
                    --source-ref "{{inputs.parameters.source-ref}}"
                    --source-digest "{{inputs.parameters.source-digest}}"
                    --track "{{inputs.parameters.track}}"
                    --epoch "{{inputs.parameters.epoch}}"
                    --run "{{workflow.parameters.run}}"
                - {name: lines, value: "{{inputs.parameters.lines}}"}
                - {name: key, value: "{{inputs.parameters.key}}"}
                - {name: digest, value: "{{inputs.parameters.digest}}"}
                - {name: html, value: /tmp/report/report.html}
              artifacts:
                - {name: work, from: "{{inputs.artifacts.work}}"}
                - {name: report, from: "{{steps.regis.outputs.artifacts.report}}", optional: true}

    - name: staged  # the second gate: judge what knock built, then promote what is sound
      inputs:
        parameters: [{name: playbook}]
        artifacts:
          - name: work
      steps:
        - - name: pending
            template: uske-read
            arguments:
              parameters:
                - name: args
                  value: >-
                    pending --policy {{workflow.parameters.path}}
                    --staged /work/staged/{{workflow.parameters.name}}.json --results /work/results
              artifacts:
                - {name: work, from: "{{inputs.artifacts.work}}"}
        - - name: evaluate
            template: evaluate
            withParam: "{{steps.pending.outputs.result}}"
            arguments:
              parameters:
                - {name: playbook, value: "{{inputs.parameters.playbook}}"}
                - {name: ref, value: "{{item.ref}}"}
                - {name: digest, value: "{{item.digest}}"}
                - {name: target, value: "{{item.target}}"}
                - {name: key, value: "{{item.key}}"}
                - {name: source-ref, value: "{{item.sourceRef}}"}
                - {name: source-digest, value: "{{item.source}}"}
                - {name: epoch, value: "{{item.epoch}}"}
                - {name: lines, value: staged-lines}
              artifacts:
                - {name: work, from: "{{inputs.artifacts.work}}"}
        - - name: record
            template: record-judged
            arguments:
              parameters:
                - name: args
                  value: >-
                    record --policy {{workflow.parameters.path}} --results /work/results
                    --lines /tmp/judged/lines
                - {name: lines, value: staged-lines}
              artifacts:
                - {name: work, from: "{{inputs.artifacts.work}}"}
        - - name: approve
            template: uske
            arguments:
              parameters:
                - name: args
                  value: >-
                    approve --policy {{workflow.parameters.path}} --results /work/results
                    --staged /work/staged/{{workflow.parameters.name}}.json
                    --out /work/staged/{{workflow.parameters.name}}.approved.json
              artifacts:
                - {name: work, from: "{{steps.record.outputs.artifacts.work}}"}
        - - name: promote  # the prepared policy, with admit: promote signs what it places
            template: knock
            when: "{{=jsonpath(steps.approve.outputs.result, '$.approved') > 0}}"
            arguments:
              parameters:
                - name: args
                  value: >-
                    promote /work/policies/{{workflow.parameters.name}}
                    --staged /work/staged/{{workflow.parameters.name}}.approved.json
              artifacts:
                - {name: work, from: "{{steps.approve.outputs.artifacts.work}}"}
        - - name: record-promoted  # the source → promoted digest link, once promote has placed it all
            template: record
            when: "{{steps.promote.status}} == Succeeded"
            arguments:
              parameters:
                - name: args
                  value: >-
                    record --policy {{workflow.parameters.path}} --results /work/results
                    --promoted /work/staged/{{workflow.parameters.name}}.approved.json
                    --run "{{workflow.parameters.run}}"
              artifacts:
                - {name: work, from: "{{steps.promote.outputs.artifacts.work}}"}

    - name: checkout
      # Container steps only: a retry on a steps template would replay the whole policy.
      retryStrategy: &child-retry
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: 10s
          factor: "2"
      inputs:
        artifacts:
          - name: snapshot  # absent on a first screening: an empty journal
            path: /tmp/snapshot
            mode: 511  # 0777: uske runs as non-root
            recurseMode: true
            optional: true
            s3: {key: "runs/{{workflow.parameters.run}}/snapshot.tgz"}
      volumes:
        - {name: work, emptyDir: {}}  # this pod's only: the work leaves as an artifact
      container:
        image: git
        command: [sh, -c]
        # The parent's commit, not the branch head (D7). The token goes as a header to the fetch
        # alone, never into .git/config; and .git goes whatever the exit code, since Argo saves
        # `work` to the artifact repository even when this step fails.
        args:
          - >-
            trap 'rm -rf /work/repo/.git' EXIT;
            git init -q /work/repo && cd /work/repo &&
            git remote add origin "https://{{workflow.parameters.repository}}" &&
            git -c http.extraHeader="Authorization: Basic $(printf 'oauth2:%s' "$TOKEN" | base64 | tr -d '\n')"
            fetch -q --depth 1 origin "{{workflow.parameters.commit}}" &&
            git checkout -q FETCH_HEAD &&
            mkdir -p /work/results &&
            if [ -f "/tmp/snapshot/{{workflow.parameters.name}}.jsonl" ]; then
              cp "/tmp/snapshot/{{workflow.parameters.name}}.jsonl" /work/results/;
            fi
        env:
          - name: TOKEN
            valueFrom:
              secretKeyRef: {name: uske-repository, key: token}
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        artifacts:
          - &work-out {name: work, path: /work}

    - name: uske
      retryStrategy: *child-retry
      inputs:
        parameters:
          - name: args
        artifacts:
          # Writable whoever extracted it: each tool's image runs as its own user.
          - &work-in {name: work, path: /work, mode: 511, recurseMode: true}  # 0777
      container:
        image: uske
        command: [sh, -c]
        args: ["python -m uske {{inputs.parameters.args}}"]
        workingDir: /app
      outputs:
        artifacts:
          - *work-out

    # A step that appends to the journal's copy, then exports every line past the snapshot with
    # the reports they cite. The key is this child's, so its last export holds all its lines, and a
    # re-created or resubmitted child adds its own archive, after this one by creation time (D9).
    - name: record
      retryStrategy: *child-retry
      inputs:
        parameters:
          - name: args
        artifacts:
          - *work-in
      container:
        image: uske
        command: [sh, -c]
        args:
          - >-
            python -m uske {{inputs.parameters.args}} &&
            python -m uske export --policy {{workflow.parameters.path}} --results /work/results
            --snapshot-lines {{workflow.parameters.snapshot-lines}} --run "{{workflow.parameters.run}}"
            --out /tmp/lines.tgz >&2
        workingDir: /app
      outputs:
        artifacts:
          - *work-out
          - &lines-out
            name: lines
            path: /tmp/lines.tgz
            archive: {none: {}}  # already an archive, read as such by `uske merge`
            artifactGC: {strategy: Never}  # the parent's merge reads it after this child is gone
            s3: {key: "runs/{{workflow.parameters.run}}/out/{{workflow.parameters.name}}/{{workflow.creationTimestamp.Y}}{{workflow.creationTimestamp.m}}{{workflow.creationTimestamp.d}}T{{workflow.creationTimestamp.H}}{{workflow.creationTimestamp.M}}{{workflow.creationTimestamp.S}}Z-{{workflow.name}}.tgz"}

    # `record` after a fan-out: its lines and reports, read back by prefix as directories. The
    # child's own name in the key keeps a resubmitted child from reading the first one's lines.
    - name: record-judged
      retryStrategy: *child-retry
      inputs:
        parameters:
          - name: args
          - {name: lines, value: lines}
        artifacts:
          - *work-in
          - name: lines  # none when nothing was owed a decision
            path: /tmp/judged/lines
            mode: 511  # 0777: uske runs as non-root
            recurseMode: true
            optional: true
            archive: {none: {}}
            s3: {key: "runs/{{workflow.parameters.run}}/policies/{{workflow.parameters.name}}/{{workflow.name}}/{{inputs.parameters.lines}}/"}
          - name: reports
            path: /tmp/judged/reports
            mode: 511  # 0777: uske runs as non-root
            recurseMode: true
            optional: true
            archive: {none: {}}
            s3: {key: "runs/{{workflow.parameters.run}}/policies/{{workflow.parameters.name}}/{{workflow.name}}/reports/"}
      container:
        image: uske
        command: [sh, -c]
        # The reports first: a line never points at a report the export cannot find.
        args:
          - >-
            if [ -d /tmp/judged/reports ]; then
              mkdir -p /work/results/reports && cp -R /tmp/judged/reports/. /work/results/reports/;
            fi &&
            python -m uske {{inputs.parameters.args}} &&
            python -m uske export --policy {{workflow.parameters.path}} --results /work/results
            --snapshot-lines {{workflow.parameters.snapshot-lines}} --run "{{workflow.parameters.run}}"
            --out /tmp/lines.tgz >&2
        workingDir: /app
      outputs:
        artifacts:
          - *work-out
          - *lines-out

    - name: classify
      retryStrategy: *child-retry
      inputs:
        parameters:
          - name: args
          - name: lines  # first gate's lines, or the held images' staged-lines
            value: lines
          - name: key
          - name: digest
          - {name: html, value: ""}  # where regis wrote it; empty for an unknown track (D-21)
        artifacts:
          - *work-in
          - {name: report, path: /tmp/report, optional: true, mode: 511, recurseMode: true}
      container:
        image: uske
        command: [sh, -c]
        args:
          # The report outlives the screening: it goes where the line says it lives once merged
          # (change `rapport-durable-dans-le-journal`), copied before the line is written.
          - >-
            set -o pipefail &&
            out=/work/{{inputs.parameters.lines}}/{{workflow.parameters.name}}/{{inputs.parameters.key}}.json &&
            copy=/work/results/reports/{{workflow.parameters.name}}/{{inputs.parameters.digest}}/{{workflow.parameters.run}}.html &&
            mkdir -p "$(dirname "$out")" &&
            if [ -f "{{inputs.parameters.html}}" ]; then
              mkdir -p "$(dirname "$copy")" && cp "{{inputs.parameters.html}}" "$copy";
            fi &&
            python -m uske {{inputs.parameters.args}} | tee "$out"
        workingDir: /app
      outputs:
        artifacts:
          - name: line
            path: /work/{{inputs.parameters.lines}}/{{workflow.parameters.name}}/{{inputs.parameters.key}}.json
            archive: {none: {}}
            s3: {key: "runs/{{workflow.parameters.run}}/policies/{{workflow.parameters.name}}/{{workflow.name}}/{{inputs.parameters.lines}}/{{inputs.parameters.key}}.json"}
          - name: report
            path: /work/results/reports/{{workflow.parameters.name}}/{{inputs.parameters.digest}}/{{workflow.parameters.run}}.html
            optional: true
            archive: {none: {}}
            s3: {key: "runs/{{workflow.parameters.run}}/policies/{{workflow.parameters.name}}/{{workflow.name}}/reports/{{workflow.parameters.name}}/{{inputs.parameters.digest}}/{{workflow.parameters.run}}.html"}

    - name: regis-analyze
      # Always: the 500 MB artifact is fetched by the init container, and OnFailure does not
      # retry a failed fetch (only the main container's failure). Same values as *child-retry, only retryPolicy differs.
      retryStrategy:
        limit: "2"
        retryPolicy: Always
        backoff:
          duration: 10s
          factor: "2"
      inputs:
        parameters: [{name: target}, {name: playbook}]
        artifacts:
          - *work-in  # the playbook, in the checkout
          - name: grype-db  # the vulnerability database the refresh distributes (grype-db.yaml)
            path: /grype/current.tar.zst  # on the volume below: Argo writes it there, no subPath mount
            optional: true  # absent before the first refresh: regis then records the cve check in error
            archive: {none: {}}
            s3: {key: grype-db/current.tar.zst}
      # This pod's only volume, an emptyDir (SDR-0021 forbids a persistent one). An input artifact
      # outside a volume is a subPath mount of the init container's disk: it cannot be deleted
      # (EBUSY). Here the archive (~500 MB) is deleted once unpacked; the database takes 3.25 GB.
      volumes:
        - {name: grype, emptyDir: {sizeLimit: 6Gi}}
      container:
        image: regis
        command: [sh, -c]
        volumeMounts:
          - {name: grype, mountPath: /grype}
        # The report directory exists even when regis fails: classify then records it inconclusive.
        # An archive that does not unpack leaves no partial database: regis runs all the same,
        # and its cve check fails with "database does not exist" instead of the step stopping.
        # `-f`, not `-e`: an absent optional artifact may materialize as an empty directory.
        args:
          - |
            mkdir -p /tmp/report
            if [ -f /grype/current.tar.zst ]; then
              python3 - <<'PY' || rm -rf /grype/db
            import sys, tarfile
            try:
                tarfile.open('/grype/current.tar.zst', 'r:zst').extractall('/grype/db', filter='data')
            except Exception as e:
                print(f"grype-db: the database could not be unpacked: {type(e).__name__}: {e}", file=sys.stderr)
                sys.exit(1)
            PY
              rm -f /grype/current.tar.zst
            fi
            regis analyze "{{inputs.parameters.target}}" \
              --playbook "{{inputs.parameters.playbook}}" \
              ${HARBOR_USER:+--auth "${HARBOR_HOST}=${HARBOR_USER}:${HARBOR_PASSWORD}"} \
              -D /tmp/report -o "report.{format}" --html
        env:  # judge with the distributed database only: no call to Anchore (D8)
          - {name: GRYPE_DB_CACHE_DIR, value: /grype/db}
          - {name: GRYPE_DB_AUTO_UPDATE, value: "false"}
          - {name: GRYPE_DB_MAX_ALLOWED_BUILT_AGE, value: 48h}
          - {name: GRYPE_CHECK_FOR_APP_UPDATE, value: "false"}
        envFrom:
          - secretRef: {name: uske-harbor}
        resources:  # the volume counts here: archive, database, and regis's own needs
          requests: {ephemeral-storage: 5Gi}
          limits: {ephemeral-storage: 6Gi}
      outputs:
        artifacts:
          - {name: report, path: /tmp/report, optional: true, mode: 511, recurseMode: true}

    - name: knock
      retryStrategy: *child-retry
      inputs:
        parameters:
          - name: args
        artifacts:
          - *work-in
      container:
        image: knock
        command: [sh, -c]  # the executor needs a command: it does not read an image's entrypoint
        # --plan-out does not create its parent directory
        args: ["mkdir -p /work/plans /work/staged /work/applied && knock {{inputs.parameters.args}}"]
        envFrom:
          - secretRef: {name: uske-knock}  # registry credentials and KNOCK_ATTEST_SIGNER
      outputs:
        artifacts:
          - *work-out

    - name: knock-once  # no retry: a retried apply rebuilds every held image under a new digest
      inputs:
        parameters:
          - name: args
        artifacts:
          - *work-in
      container:
        image: knock
        command: [sh, -c]
        args: ["mkdir -p /work/plans /work/staged /work/applied && knock {{inputs.parameters.args}}"]
        envFrom:
          - secretRef: {name: uske-knock}
      outputs:
        artifacts:
          # Saved on failure too, at a key of its own: record-applied reads what was placed,
          # whether place or place-staged ran.
          - name: work
            path: /work
            s3: {key: "runs/{{workflow.parameters.run}}/policies/{{workflow.parameters.name}}/{{workflow.name}}/placed.tgz"}

    # A child resubmitted alone merges its policy's lines, every child's of the screening, under
    # the parent merge's lock (D12). The parent's mark is the parent's to clear.
    - name: merge
      retryStrategy: *child-retry
      synchronization:
        mutexes:
          - name: uske-journal
      inputs:
        artifacts:
          - name: lines
            path: "/tmp/out/{{workflow.parameters.name}}"
            mode: 511  # 0777: uske runs as non-root
            recurseMode: true
            optional: true
            archive: {none: {}}
            s3: {key: "runs/{{workflow.parameters.run}}/out/{{workflow.parameters.name}}/"}
      volumes:
        - name: results
          persistentVolumeClaim: {claimName: uske-results}
      container:
        image: uske
        command: [sh, -c]
        args: ["python -m uske merge --results /results --from /tmp/out"]
        workingDir: /app
        volumeMounts:
          - {name: results, mountPath: /results}

    - name: fail  # no retry
      inputs:
        parameters:
          - name: message
      container:
        image: uske
        command: [sh, -c]
        args: ["echo '{{inputs.parameters.message}}' >&2; exit 1"]

    # Appended last: deploy/kind patches the templates above by index.
    - name: uske-read  # a step that reads `work` and changes nothing: it hands no `work` on
      retryStrategy: *child-retry
      inputs:
        parameters:
          - name: args
        artifacts:
          - *work-in
      container:
        image: uske
        command: [sh, -c]
        args: ["python -m uske {{inputs.parameters.args}}"]
        workingDir: /app

    - name: done  # the parent's summary counts this mark; its absence names a failed policy
      retryStrategy: *child-retry
      container:
        image: uske
        command: [sh, -c]
        args: ["echo '{{workflow.name}}' > /tmp/done"]
      outputs:
        artifacts:
          - name: done
            path: /tmp/done
            archive: {none: {}}
            artifactGC: {strategy: Never}  # read by the parent's summary
            s3: {key: "runs/{{workflow.parameters.run}}/done/{{workflow.parameters.name}}"}
