# One screening: every policy, one after the other; for each, knock plans, regis judges the plan's
# digests, and knock applies only the approved operations (D-30, knock's gate). A source refused on
# rules its regime lists as repairable is handed back with a remediation order: knock repairs that
# digest, holds it in a transit registry, where it is judged by its own digest and promoted only if
# it is sound (change `split-knock-policy-transform-remediate`). A transform-only rebuild is placed
# directly. The transit is passed to knock only when the plan carries an order.
# Change `socle-amorce-orchestrateur`, design decisions 3 and 6 to 10.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: uske-screening
spec:
  serviceAccountName: uske
  entrypoint: screening
  # ponytail: one step at a time, the per-run volume is ReadWriteOnce; widen with RWX storage
  parallelism: 1
  arguments:
    parameters:
      - name: repository  # host/path of this repository, set by the overlay
      - name: policies
        value: policies/pilote
      - name: playbooks  # in that repository too
        value: playbooks
      - name: transit  # a name of KNOCK_REGISTRIES: where remediated images are held until judged
        value: transit
      # The remediation orders' epoch: the screening's start, UTC. Written into the repair's RUN,
      # so a later screening never reuses an earlier upgrade layer.
      - name: epoch
        value: "{{workflow.creationTimestamp.Y}}{{workflow.creationTimestamp.m}}{{workflow.creationTimestamp.d}}T{{workflow.creationTimestamp.H}}{{workflow.creationTimestamp.M}}{{workflow.creationTimestamp.S}}Z"
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: uske-results

  templates:
    - name: screening
      steps:
        - - name: checkout
            template: checkout
        - - name: list
            template: uske
            arguments:
              parameters:
                - name: args
                  value: list --policies /work/repo/{{workflow.parameters.policies}}
        - - name: policy
            template: policy
            withParam: "{{steps.list.outputs.result}}"
            arguments:
              parameters:
                - name: name
                  value: "{{item.name}}"
                - name: path
                  value: "{{item.path}}"

    - name: policy
      inputs:
        parameters:
          - name: name
          - name: path
      synchronization:
        mutexes:
          - name: "policy-{{inputs.parameters.name}}"
      steps:
        - - name: prepare
            template: uske
            arguments:
              parameters:
                - name: args
                  value: >-
                    prepare --policy {{inputs.parameters.path}}
                    --out /work/policies/{{inputs.parameters.name}}/policy.yaml
        - - name: plan  # knock's gate, step 1: place nothing, write every operation (D-30)
            template: knock
            arguments:
              parameters:
                - name: args
                  value: >-
                    reconcile /work/policies/{{inputs.parameters.name}}
                    --plan-out /work/plans/{{inputs.parameters.name}}.json
        - - name: pending
            template: uske
            arguments:
              parameters:
                - name: args
                  value: >-
                    pending --policy {{inputs.parameters.path}}
                    --plan /work/plans/{{inputs.parameters.name}}.json --results /results
          - name: resolve
            template: uske
            arguments:
              parameters:
                - name: args
                  value: resolve --policy {{inputs.parameters.path}} --playbooks /work/repo/{{workflow.parameters.playbooks}}
        - - name: evaluate
            template: evaluate
            withParam: "{{steps.pending.outputs.result}}"
            when: "{{=jsonpath(steps.resolve.outputs.result, '$.playbook') != nil}}"
            arguments:
              parameters:
                - {name: policy, value: "{{inputs.parameters.name}}"}
                - {name: playbook, value: "{{=jsonpath(steps.resolve.outputs.result, '$.playbook')}}"}
                - {name: ref, value: "{{item.ref}}"}
                - {name: digest, value: "{{item.digest}}"}
                - {name: target, value: "{{item.target}}"}
                - {name: key, value: "{{item.key}}"}
                - {name: track, value: "{{=jsonpath(steps.resolve.outputs.result, '$.track') ?? ''}}"}
          - name: unevaluated  # unknown regime: never sent to regis (D-21)
            template: classify
            withParam: "{{steps.pending.outputs.result}}"
            when: "{{=jsonpath(steps.resolve.outputs.result, '$.playbook') == nil}}"
            arguments:
              parameters:
                - name: args
                  value: classify --ref {{item.ref}} --digest {{item.digest}} --run "{{workflow.name}}"
                - {name: out, value: "/work/lines/{{inputs.parameters.name}}/{{item.key}}.json"}
        - - name: record
            template: uske
            arguments:
              parameters:
                - name: args
                  value: >-
                    record --policy {{inputs.parameters.path}} --results /results
                    --lines /work/lines/{{inputs.parameters.name}}
        - - name: approve
            template: uske
            arguments:
              parameters:
                - name: args
                  value: >-
                    approve --policy {{inputs.parameters.path}} --results /results
                    --plan /work/plans/{{inputs.parameters.name}}.json
                    --out /work/plans/{{inputs.parameters.name}}.approved.json
                    --transit "{{workflow.parameters.transit}}"
                    --epoch {{workflow.parameters.epoch}}
                    --lines-out /work/approve-lines/{{inputs.parameters.name}}.json
                    --run "{{workflow.name}}"
        - - name: record-approve  # a source to repair without a transit: judged again next time
            template: uske
            arguments:
              parameters:
                - name: args
                  value: >-
                    record --policy {{inputs.parameters.path}} --results /results
                    --lines /work/approve-lines/{{inputs.parameters.name}}.json
        - - name: place  # knock's gate, step 2, no order: copies and transform-only rebuilds placed
            template: knock-once
            when: >-
              {{=jsonpath(steps.approve.outputs.result, '$.approved') > 0 &&
              jsonpath(steps.approve.outputs.result, '$.ordered') == 0}}
            continueOn:  # what was placed must still be recorded
              failed: true
              error: true
            arguments:
              parameters:
                - name: args
                  value: >-
                    reconcile /work/policies/{{inputs.parameters.name}}
                    --apply-plan /work/plans/{{inputs.parameters.name}}.approved.json
                    --applied-out /work/applied/{{inputs.parameters.name}}.json
          - name: place-staged  # with orders: the remediated images are held in the transit
            template: knock-once
            when: "{{=jsonpath(steps.approve.outputs.result, '$.ordered') > 0}}"
            continueOn:  # one failed build must not withhold the images that were held
              failed: true
              error: true
            arguments:
              parameters:
                - name: args
                  value: >-
                    reconcile /work/policies/{{inputs.parameters.name}}
                    --apply-plan /work/plans/{{inputs.parameters.name}}.approved.json
                    --stage-to {{workflow.parameters.transit}}
                    --staged-out /work/staged/{{inputs.parameters.name}}.json
                    --applied-out /work/applied/{{inputs.parameters.name}}.json
        - - name: record-applied  # the source → placed link, and the orders knock withheld
            template: uske
            when: "{{=jsonpath(steps.approve.outputs.result, '$.approved') > 0}}"
            arguments:
              parameters:
                - name: args
                  value: >-
                    record --policy {{inputs.parameters.path}} --results /results
                    --applied /work/applied/{{inputs.parameters.name}}.json
                    --run "{{workflow.name}}"
        - - name: second-gate
            template: staged
            when: "{{=jsonpath(steps.approve.outputs.result, '$.ordered') > 0}}"
            arguments:
              parameters:
                - {name: name, value: "{{inputs.parameters.name}}"}
                - {name: path, value: "{{inputs.parameters.path}}"}
                - {name: playbook, value: "{{=jsonpath(steps.resolve.outputs.result, '$.playbook')}}"}
        - - name: place-failed  # the failure stays visible once everything held has been handled
            template: fail
            when: >-
              {{steps.place.status}} == Failed || {{steps.place.status}} == Error ||
              {{steps.place-staged.status}} == Failed || {{steps.place-staged.status}} == Error

    - name: evaluate
      inputs:
        parameters:
          - {name: policy}
          - {name: playbook}
          - {name: ref}
          - {name: digest}
          - {name: target}
          - {name: key}
          # A held image names its source and writes its lines apart: read with the first
          # gate's, the source's own line would be replayed after its closure.
          - {name: source-ref, value: ""}
          - {name: source-digest, value: ""}
          - {name: lines, value: lines}
          - {name: track, value: ""}  # first gate: the regime whose repairable rules apply
          - {name: epoch, value: ""}  # held image: the remediation order it was built under
      steps:
        - - name: regis
            template: regis-analyze
            continueOn:
              failed: true  # a failed evaluation is recorded inconclusive, not lost (D-23)
            arguments:
              parameters:
                - {name: target, value: "{{inputs.parameters.target}}"}
                - {name: playbook, value: "{{inputs.parameters.playbook}}"}
                - {name: key, value: "{{inputs.parameters.key}}"}
        - - name: classify
            template: classify
            arguments:
              parameters:
                - name: args
                  value: >-
                    classify --playbook {{inputs.parameters.playbook}}
                    --ref {{inputs.parameters.ref}} --digest {{inputs.parameters.digest}}
                    --report /work/reports/{{inputs.parameters.key}}/report.json
                    --report-link /results/reports/{{inputs.parameters.policy}}/{{inputs.parameters.digest}}/{{workflow.name}}.html
                    --regis-exit {{steps.regis.exitCode}}
                    --source-ref "{{inputs.parameters.source-ref}}"
                    --source-digest "{{inputs.parameters.source-digest}}"
                    --track "{{inputs.parameters.track}}"
                    --epoch "{{inputs.parameters.epoch}}"
                    --run "{{workflow.name}}"
                - {name: out, value: "/work/{{inputs.parameters.lines}}/{{inputs.parameters.policy}}/{{inputs.parameters.key}}.json"}
                - {name: html, value: "/work/reports/{{inputs.parameters.key}}/report.html"}
                - {name: link, value: "/results/reports/{{inputs.parameters.policy}}/{{inputs.parameters.digest}}/{{workflow.name}}.html"}

    - name: checkout
      # Container steps only: a retry on a steps template would replay the whole policy.
      retryStrategy: &retry
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: 10s
          factor: "2"
      container:
        image: git
        command: [sh, -c]
        args:
          - >-
            rm -rf /work/repo &&
            git clone --depth 1 "https://oauth2:${TOKEN}@{{workflow.parameters.repository}}" /work/repo
        env:
          - name: TOKEN
            valueFrom:
              secretKeyRef: {name: uske-repository, key: token}
        volumeMounts:
          - {name: work, mountPath: /work}

    - name: uske
      retryStrategy: *retry
      inputs:
        parameters:
          - name: args
      container:
        image: uske
        command: [sh, -c]
        args: ["python -m uske {{inputs.parameters.args}}"]
        workingDir: /app
        volumeMounts:
          - {name: work, mountPath: /work}
          - {name: results, mountPath: /results}

    - name: classify
      retryStrategy: *retry
      inputs:
        parameters:
          - name: args
          - name: out
          # Empty for an unknown regime: no regis, no report (D-21).
          - {name: html, value: ""}  # where regis wrote it, on the screening's volume
          - {name: link, value: ""}  # where it survives, next to the journal
      container:
        image: uske
        command: [sh, -c]
        args:
          # The report outlives the screening: its volume goes, /results stays (change
          # `rapport-durable-dans-le-journal`). Copied before the line that points at it is written.
          - >-
            set -o pipefail && mkdir -p "$(dirname {{inputs.parameters.out}})" &&
            if [ -f "{{inputs.parameters.html}}" ]; then
              mkdir -p "$(dirname {{inputs.parameters.link}})" &&
              cp "{{inputs.parameters.html}}" "{{inputs.parameters.link}}";
            fi &&
            python -m uske {{inputs.parameters.args}} | tee {{inputs.parameters.out}}
        workingDir: /app
        volumeMounts:
          - {name: work, mountPath: /work}
          - {name: results, mountPath: /results}

    - name: regis-analyze
      retryStrategy: *retry
      inputs:
        parameters: [{name: target}, {name: playbook}, {name: key}]
      container:
        image: regis
        command: [sh, -c]
        args:
          - >-
            regis analyze "{{inputs.parameters.target}}"
            --playbook "{{inputs.parameters.playbook}}"
            ${HARBOR_USER:+--auth "${HARBOR_HOST}=${HARBOR_USER}:${HARBOR_PASSWORD}"}
            -D /work/reports/{{inputs.parameters.key}} -o "report.{format}" --html
        envFrom:
          - secretRef: {name: uske-harbor}
        volumeMounts:
          - {name: work, mountPath: /work}

    - name: knock
      retryStrategy: *retry
      inputs:
        parameters:
          - name: args
      container:
        image: knock
        command: [sh, -c]  # the executor needs a command: it does not read an image's entrypoint
        # --plan-out does not create its parent directory
        args: ["mkdir -p /work/plans /work/staged /work/applied && knock {{inputs.parameters.args}}"]
        envFrom:
          - secretRef: {name: uske-knock}  # registry credentials and KNOCK_ATTEST_SIGNER
        volumeMounts:
          - {name: work, mountPath: /work}

    - name: staged  # the second gate: judge what knock built, then promote what is sound
      inputs:
        parameters: [{name: name}, {name: path}, {name: playbook}]
      steps:
        - - name: pending
            template: uske
            arguments:
              parameters:
                - name: args
                  value: >-
                    pending --policy {{inputs.parameters.path}}
                    --staged /work/staged/{{inputs.parameters.name}}.json --results /results
        - - name: evaluate
            template: evaluate
            withParam: "{{steps.pending.outputs.result}}"
            arguments:
              parameters:
                - {name: policy, value: "{{inputs.parameters.name}}"}
                - {name: playbook, value: "{{inputs.parameters.playbook}}"}
                - {name: ref, value: "{{item.ref}}"}
                - {name: digest, value: "{{item.digest}}"}
                - {name: target, value: "{{item.target}}"}
                - {name: key, value: "{{item.key}}"}
                - {name: source-ref, value: "{{item.sourceRef}}"}
                - {name: source-digest, value: "{{item.source}}"}
                - {name: epoch, value: "{{item.epoch}}"}
                - {name: lines, value: staged-lines}
        - - name: record
            template: uske
            arguments:
              parameters:
                - name: args
                  value: >-
                    record --policy {{inputs.parameters.path}} --results /results
                    --lines /work/staged-lines/{{inputs.parameters.name}}
        - - name: approve
            template: uske
            arguments:
              parameters:
                - name: args
                  value: >-
                    approve --policy {{inputs.parameters.path}} --results /results
                    --staged /work/staged/{{inputs.parameters.name}}.json
                    --out /work/staged/{{inputs.parameters.name}}.approved.json
        - - name: promote  # the prepared policy, with admit: promote signs what it places
            template: knock
            when: "{{=jsonpath(steps.approve.outputs.result, '$.approved') > 0}}"
            arguments:
              parameters:
                - name: args
                  value: >-
                    promote /work/policies/{{inputs.parameters.name}}
                    --staged /work/staged/{{inputs.parameters.name}}.approved.json
        - - name: record-promoted  # the source → promoted digest link, once promote has placed it all
            template: uske
            when: "{{steps.promote.status}} == Succeeded"
            arguments:
              parameters:
                - name: args
                  value: >-
                    record --policy {{inputs.parameters.path}} --results /results
                    --promoted /work/staged/{{inputs.parameters.name}}.approved.json
                    --run "{{workflow.name}}"

    - name: knock-once  # no retry: a retried apply rebuilds every held image under a new digest
      inputs:
        parameters:
          - name: args
      container:
        image: knock
        command: [sh, -c]
        args: ["mkdir -p /work/plans /work/staged /work/applied && knock {{inputs.parameters.args}}"]
        envFrom:
          - secretRef: {name: uske-knock}
        volumeMounts:
          - {name: work, mountPath: /work}

    - name: fail  # no retry either
      container:
        image: uske
        command: [sh, -c]
        args: ["echo 'knock reconcile --apply-plan failed for this policy' >&2; exit 1"]
