# Results outlive screenings: one append-only file per policy, written by the merge only (the
# snapshot leaves only its mark, `.pending-merge/<run>`, beside them).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uske-results
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi  # the journal, plus one regis HTML report per decision (up to 5.6 MiB each)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uske
---
# What the Argo executor needs to report step outputs, and the artifact GC pods to report what
# they deleted (`artifactGC`, change `screen-and-policy-fan-out`); nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uske-executor
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
  - apiGroups: [argoproj.io]
    resources: [workflowartifactgctasks]
    verbs: [list, watch]
  - apiGroups: [argoproj.io]
    resources: [workflowartifactgctasks/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uske-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uske-executor
subjects:
  - kind: ServiceAccount
    name: uske
---
# What the parent's `resource` steps need to create a child Workflow per policy and wait for it
# (change `screen-and-policy-fan-out`, D8); nothing else is widened. `setOwnerReference` sets
# `blockOwnerDeletion`, which OwnerReferencesPermissionEnforcement (OpenShift) admits only from
# whoever may update the owner's finalizers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uske-children
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get, list, watch, patch]
  - apiGroups: [argoproj.io]
    resources: [workflows/finalizers]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uske-children
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uske-children
subjects:
  - kind: ServiceAccount
    name: uske
