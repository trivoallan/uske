# Results outlive screenings: one append-only file per policy, written by the merge only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uske-results
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi  # the journal, plus one regis HTML report per decision (up to 5.6 MiB each)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uske
---
# What the Argo executor needs to report step outputs; nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uske-executor
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uske-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uske-executor
subjects:
  - kind: ServiceAccount
    name: uske
---
# What the parent's `resource` steps need to create a child Workflow per policy and wait for it
# (change `screen-and-policy-fan-out`, D8); nothing else is widened.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uske-children
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uske-children
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uske-children
subjects:
  - kind: ServiceAccount
    name: uske
